<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>치즈냥 팀 매일 인증</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=JetBrains+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="style.css">
<script type="module" src="app.js"></script>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <p class="eyebrow">3D 데스크톱 펫 프로젝트 · 30일 기록</p>
      <h1 id="title">치즈냥 팀 <span>매일 인증</span></h1>
      <p class="range" id="range"></p>
    </div>
    <div class="progress" id="progress"></div>
  </header>

  <p class="notice" id="notice" hidden></p>

  <section class="board">
    <div class="board-head">
      <h2>30일 보드</h2>
      <p class="legend">날짜를 누르면 그날 올린 것을 볼 수 있어요</p>
    </div>
    <div class="days" id="days"></div>
  </section>

  <section class="day">
    <div class="day-main" id="dayMain"></div>

    <aside class="side">
      <div class="panel" id="uploader">
        <h2>올리기</h2>
        <label>날짜
          <select id="daySelect"></select>
        </label>
        <div class="drop" id="drop" tabindex="0" role="button">
          <b>파일을 고르거나 끌어다 놓으세요</b>
          <span>형식 상관없이 파일당 25MB까지</span>
        </div>
        <input type="file" id="fileInput" multiple hidden>
        <p class="picked" id="picked" hidden></p>
        <div class="or">또는 링크 붙이기</div>
        <label>링크 (큰 파일은 클라우드에 올리고 여기에 붙여 주세요)
          <input type="url" id="linkInput" placeholder="https://...">
        </label>
        <label>메모 (선택)
          <textarea id="noteInput" maxlength="500" placeholder="오늘 한 일, 예: tail1–tail5에 꼬리 흔들기 추가"></textarea>
        </label>
        <button class="btn primary" id="submitBtn" type="button">올리기</button>
        <p class="status" id="status" role="status"></p>
      </div>
    </aside>
  </section>
</div>

<dialog class="viewer" id="viewer" tabindex="-1">
  <div class="viewer-top">
    <span class="viewer-count" id="viewerCount"></span>
    <a class="viewer-open" id="viewerOpen" target="_blank" rel="noopener">원본 열기</a>
    <button class="viewer-x" id="viewerClose" type="button" aria-label="닫기">×</button>
  </div>
  <button class="viewer-nav prev" id="viewerPrev" type="button" aria-label="이전">‹</button>
  <div class="viewer-stage" id="viewerStage"></div>
  <button class="viewer-nav next" id="viewerNext" type="button" aria-label="다음">›</button>
  <div class="viewer-cap" id="viewerCap"></div>
</dialog>
</body>
</html>
