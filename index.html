<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>橘猫组每日打卡</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=ZCOOL+QingKe+HuangYou&family=JetBrains+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="style.css">
<script type="module" src="app.js"></script>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <p class="eyebrow">3D 桌宠项目 · 组员每日上传</p>
      <h1 id="title">橘猫组<span>每日打卡</span></h1>
      <p class="range" id="range"></p>
    </div>
    <div class="progress" id="progress"></div>
  </header>

  <p class="notice" id="notice" hidden></p>

  <section class="board">
    <div class="board-head">
      <h2>30 天上传墙</h2>
      <div class="legend">没传 <i class="lg miss"></i><i class="lg l1"></i><i class="lg l2"></i><i class="lg l3"></i> 3 个以上 · 点格子看当天</div>
    </div>
    <div class="scroll"><table id="grid"></table></div>
  </section>

  <section class="day">
    <div class="day-main" id="dayMain"></div>

    <aside class="side">
      <form class="panel" id="loginForm" hidden>
        <h2>登录后上传</h2>
        <label>我是
          <select id="memberSelect" required></select>
        </label>
        <label>组里的密码
          <input type="password" id="pwInput" autocomplete="current-password" required>
        </label>
        <button class="btn primary" type="submit" id="loginBtn">登录</button>
        <p class="status" id="loginStatus" role="status"></p>
      </form>

      <div class="panel" id="uploader" hidden>
        <div class="who-bar">
          <h2 id="upTitle">上传到今天</h2>
          <button class="link-btn" id="logoutBtn" type="button">退出</button>
        </div>
        <p class="hint" id="whoami"></p>
        <div class="drop" id="drop" tabindex="0" role="button">
          <b>点这里选文件，或拖进来</b>
          <span>任何格式都可以，单个不超过 25 MB</span>
        </div>
        <input type="file" id="fileInput" multiple hidden>
        <p class="picked" id="picked" hidden></p>
        <div class="or">或者贴链接</div>
        <label>链接（更大的文件放网盘后贴这里）
          <input type="url" id="linkInput" placeholder="https://...">
        </label>
        <label>备注（可选）
          <textarea id="noteInput" maxlength="500" placeholder="今天做了什么，比如：给 tail1–tail5 加了甩尾"></textarea>
        </label>
        <button class="btn primary" id="submitBtn" type="button">上传</button>
        <p class="status" id="status" role="status"></p>
      </div>
    </aside>
  </section>
</div>
</body>
</html>
