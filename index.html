<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFFBF6">
<title>치즈냥 팀 매일 인증</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap">
<link rel="stylesheet" href="style.css">
<script type="module" src="app.js"></script>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="mascot" aria-hidden="true">
        <svg viewBox="0 0 64 64"><path d="M12 26 L14 8 L26 18 Z M52 26 L50 8 L38 18 Z" fill="#F59A4A"/><path d="M15.5 21 L16 13 L22 18 Z M48.5 21 L48 13 L42 18 Z" fill="#FFD3A8"/><ellipse cx="32" cy="36" rx="22" ry="19" fill="#F59A4A"/><path d="M20 22 q4 3 3 7 M44 22 q-4 3 -3 7 M32 18 v6" stroke="#E07F2C" stroke-width="2.4" fill="none" stroke-linecap="round"/><ellipse cx="32" cy="43" rx="11" ry="8" fill="#FFF1E4"/><path d="M22 34 q3 -3 6 0 M36 34 q3 -3 6 0" stroke="#4A3A2E" stroke-width="2.4" fill="none" stroke-linecap="round"/><path d="M30 40 h4 l-2 2 z" fill="#E8707A"/><path d="M32 42 q-2 3 -5 2 M32 42 q2 3 5 2" stroke="#4A3A2E" stroke-width="1.6" fill="none" stroke-linecap="round"/><circle cx="20" cy="40" r="3" fill="#FFB3A0" opacity=".7"/><circle cx="44" cy="40" r="3" fill="#FFB3A0" opacity=".7"/></svg>
      </div>
      <div>
        <p class="eyebrow">3D 데스크톱 펫 프로젝트 · 멤버 매일 업로드</p>
        <h1 id="title">치즈냥 팀 <span>매일 인증</span></h1>
        <p class="range" id="range"></p>
      </div>
    </div>
    <div class="progress" id="progress"></div>
  </header>

  <p class="notice" id="notice" hidden></p>

  <section class="board">
    <div class="board-head">
      <h2>30일 업로드 보드</h2>
      <div class="legend">안 올림 <i class="lg miss"></i><i class="lg l1"></i><i class="lg l2"></i><i class="lg l3"></i> 3개 이상 · 칸을 누르면 그날을 볼 수 있어요</div>
    </div>
    <div class="scroll"><table id="grid"></table></div>
  </section>

  <section class="day">
    <div class="day-main" id="dayMain"></div>

    <aside class="side">
      <form class="panel" id="loginForm" hidden>
        <h2>이름만 고르면 바로 올릴 수 있어요</h2>
        <label>나는
          <select id="memberSelect"></select>
        </label>
        <button class="btn primary" type="submit" id="loginBtn">확인</button>
        <p class="status" id="loginStatus" role="status"></p>
      </form>

      <div class="panel" id="uploader" hidden>
        <div class="who-bar">
          <h2 id="upTitle">오늘 올리기</h2>
          <button class="link-btn" id="logoutBtn" type="button">사람 바꾸기</button>
        </div>
        <p class="hint" id="whoami"></p>
        <div class="drop" id="drop" tabindex="0" role="button">
          <b>여기를 눌러 파일을 고르거나 끌어다 놓으세요</b>
          <span>형식 상관없이 파일당 25MB까지</span>
        </div>
        <input type="file" id="fileInput" multiple hidden>
        <p class="picked" id="picked" hidden></p>
        <div class="or">또는 링크 붙이기</div>
        <label>링크 (큰 파일은 클라우드에 올리고 여기에 붙여 주세요)
          <input type="url" id="linkInput" placeholder="https://...">
        </label>
        <label>메모 (선택)
          <textarea id="noteInput" maxlength="500" placeholder="오늘 한 일, 예: tail1–tail5에 꼬리 흔들기 추가"></textarea>
        </label>
        <button class="btn primary" id="submitBtn" type="button">올리기</button>
        <p class="status" id="status" role="status"></p>
      </div>
    </aside>
  </section>

  <footer>오늘도 수고했어요 🧡 조금씩, 매일매일</footer>
</div>
</body>
</html>
